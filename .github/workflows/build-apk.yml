name: Build APK

# Se déclenche uniquement à la main depuis l'onglet "Actions" de GitHub
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances npm
        run: npm install

      - name: Installer Java (requis par Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Générer le projet Android natif (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK release (JS embarqué, installable seul)
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ouca-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
